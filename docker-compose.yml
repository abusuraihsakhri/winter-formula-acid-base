version: '3.8'

services:
  winter-formula-acid-base:
    build: .
    container_name: winter-formula-acid-base
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=winter-formula-acid-base-prod-audit-key-2026
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
