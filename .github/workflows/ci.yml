name: CI

on:
  push:
    branches: [master, main, "audit/**"]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          pip check
      - name: Compile Python
        run: python -m compileall -q winter_acid_base.py cli.py agents tests
      - name: Run Python tests
        run: python -m pytest -q
      - name: Test browser engine
        run: |
          node --check web/calculator.js
          node --check web/app.js
          node - <<'JS'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const ctx = {};
          vm.runInNewContext(fs.readFileSync('web/calculator.js', 'utf8'), ctx);
          const a = ctx.calculateMetrics({ hco3: 12, pco2: 26, sodium: 140, chloride: 100, albumin: 2 });
          if (a.expected_pco2 !== 26 || a.corrected_anion_gap !== 33 || a.delta_ratio !== 1.75) {
            throw new Error('Browser formula regression');
          }
          if (!a.respiratory_interpretation.startsWith('Within expected')) {
            throw new Error('Browser compensation regression');
          }
          for (const invalid of [{hco3: ''}, {hco3: 0}, {hco3: '12', sodium: 140}]) {
            try { ctx.calculateMetrics(invalid); throw new Error('Accepted invalid input'); }
            catch (e) { if (e.message === 'Accepted invalid input') throw e; }
          }
          JS
